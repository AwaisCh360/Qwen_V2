name: Set Qwen Account Passwords

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Processing Mode'
        required: true
        default: 'latest'
        type: choice
        options:
          - 'latest'
          - 'range'
          - 'all'
      count:
        description: 'Number of accounts (for latest or range)'
        required: true
        default: '30'
        type: string
      start:
        description: 'Start account number (1-based, for range)'
        required: false
        default: '1'
        type: string
      delay:
        description: 'Delay between accounts in seconds'
        required: false
        default: '2'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  set-passwords:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install-deps

      - name: Install CloakBrowser Chromium
        run: |
          python -m cloakbrowser install

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Password Setter
        env:
          PYTHONUNBUFFERED: "1"
          MAZDOOR_API_KEY: ${{ secrets.MAZDOOR_API_KEY || 'tk_0a65841dd0a074510cc79e8c16ee3ca18e9fe5a4d5f95634' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "latest" ]; then
            xvfb-run -a python set_passwords.py --latest ${{ github.event.inputs.count }} --delay ${{ github.event.inputs.delay }}
          elif [ "${{ github.event.inputs.mode }}" = "range" ]; then
            xvfb-run -a python set_passwords.py --start ${{ github.event.inputs.start }} --max ${{ github.event.inputs.count }} --delay ${{ github.event.inputs.delay }}
          else
            xvfb-run -a python set_passwords.py --start 1 --max 500 --delay ${{ github.event.inputs.delay }}
          fi

      - name: Commit and Push Updated Accounts
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/accounts.json output/accounts.txt || true
          if git diff --staged --quiet; then
            echo "No account updates to commit."
          else
            git commit -m "chore(accounts): update verified passwords and tokens [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Upload Verified Accounts Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-verified-accounts-${{ github.run_id }}
          path: |
            output/accounts.json
            output/accounts.txt
          if-no-files-found: warn
          retention-days: 14
