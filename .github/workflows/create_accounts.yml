name: Create Qwen Accounts

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of accounts to create'
        required: true
        default: '3'
        type: string
      delay:
        description: 'Delay (seconds) between accounts'
        required: true
        default: '5'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  create-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install-deps

      - name: Install CloakBrowser Chromium
        run: |
          python -m cloakbrowser install || true


      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Qwen HTTP Account Maker
        env:
          PYTHONUNBUFFERED: "1"
          MAZDOOR_API_KEY: ${{ secrets.MAZDOOR_API_KEY || 'tk_0a65841dd0a074510cc79e8c16ee3ca18e9fe5a4d5f95634' }}
        run: |
          xvfb-run -a python main.py --count ${{ github.event.inputs.count }} --delay ${{ github.event.inputs.delay }}

      - name: Commit and Push Generated Accounts to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/accounts.json output/accounts.txt || true
          if git diff --staged --quiet; then
            echo "No new accounts to commit."
          else
            git commit -m "chore(accounts): save generated accounts [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Upload Generated Accounts Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-accounts-${{ github.run_id }}
          path: |
            output/accounts.json
            output/accounts.txt
          if-no-files-found: warn
          retention-days: 14
